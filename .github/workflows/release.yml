name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for changesets
        id: changesets
        run: |
          if [ -f .changeset/config.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changesets.outputs.enabled == 'true'
        with:
          version: 12

      - uses: actions/setup-node@v4
        if: steps.changesets.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        if: steps.changesets.outputs.enabled == 'true'
        run: npm install -g npm@latest

      - name: Install
        if: steps.changesets.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish
        if: steps.changesets.outputs.enabled == 'true'
        # v2 of the action is the one that works with Changesets 3.
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
          create-github-releases: true
